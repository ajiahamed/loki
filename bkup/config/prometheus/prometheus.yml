global:
  scrape_interval: 15s

scrape_configs:
  # Scrape Prometheus from this server
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape metrics from remote servers running Docker containers
  - job_name: 'docker-hosts'
    static_configs:
      - targets:
        - 'vps1:9100'  # Replace with your remote VPS IP and node exporter port
        - 'vps2:9100'
        - 'vps3:9100'
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

