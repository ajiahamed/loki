global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']  # Replace with your node exporter targets

  # Add more scrape configs as needed
